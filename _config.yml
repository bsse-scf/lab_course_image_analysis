# Book settings
title: "Methods in Cell Analysis and Laboratory Automation: Image Analysis"
author: Marvin Albert and Andreas Cuny. Large parts of the content were adapted with permission from teaching material developed by Aaron Ponti.
copyright: "2026 ETH Zurich"
logo: '.logo.svg'

# Only build files that are actually in the table of contents, so stray drafts
# and instructor material never leak onto the published site.
only_build_toc_files: true

exclude_patterns:
  - _build
  - .pixi
  - .venv
  - .git
  - .pytest_cache
  - .ipynb_checkpoints
  # Instructor-side material, never published.
  - notebooks/*_solution.ipynb
  - notebooks/tests/*
  - instructor_notes.md
  - AGENTS.md
  # Course data is distributed by clone (git-lfs) and polybox, not served by the
  # site. Sphinx matches these against html_static_path entries too.
  - data
  - scripts
  - macros

execute:
  # Notebooks are committed WITH their outputs and are not re-executed here.
  #
  # This is deliberate, and it is not the same mistake the previous edition made.
  # The `docs` environment has `no-default-feature = true`, so it contains
  # jupyter-book and nothing else - no numpy, no scikit-image, no cellpose.
  # Executing notebooks at build time would mean giving the docs environment the
  # entire 3.5 GB scientific stack just to render a website.
  #
  # The guarantee that the notebooks actually run lives where it belongs, in CI:
  # `pixi run test-nb` executes every walkthrough in the real environment on
  # each push. That is a stronger check than a build-time execution, because it
  # runs the same environment the students use.
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - html_image
    - colon_fence
    - dollarmath   # needed for $...$ and $$...$$
    - amsmath      # needed for \begin{equation}...\end{equation}

sphinx:
  recursive_update: true  # merge instead of overwriting defaults
  config:
    html_theme_options:
      show_toc_level: 2
    nb_merge_streams: true
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    mathjax3_config:
      tex:
        inlineMath: [["$", "$"], ["\\(", "\\)"]]
        displayMath: [["$$", "$$"], ["\\[", "\\]"]]
