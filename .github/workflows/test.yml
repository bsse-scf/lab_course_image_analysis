name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when the branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # `solutions/` is a private submodule. CI must not try to fetch it -
          # the checkout would fail for anyone without access. The exercise
          # sync check warns loudly when it is missing; see AGENTS.md.
          submodules: false

      # napari and Qt need these on a headless Linux runner, or `import napari`
      # fails with a libGL error.
      - name: system libraries for Qt
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          environments: default

      - name: how long does a cold install take?
        run: pixi list --environment default | wc -l

      - name: unit tests
        run: pixi run test

      - name: schedule is in sync
        run: pixi run check-schedule

  notebooks:
    name: notebooks execute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: system libraries for Qt
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          environments: default

      # xvfb supplies a virtual display, so any napari cell can run.
      - name: execute the walkthroughs
        run: xvfb-run -a pixi run test-nb

  book:
    name: book builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          pixi-version: v0.77.1
          cache: true
          environments: docs

      - name: build
        run: |
          pixi run -e docs book-clean
          pixi run -e docs book

      - uses: actions/upload-artifact@v4
        with:
          name: book
          path: _build/html
          retention-days: 7
