name: links

# External links rot silently - the iaf docs moved once already, and the BBBC
# and polybox URLs are outside our control. Weekly is often enough to notice
# before a student does.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,403,429
            --exclude-path _build
            --exclude-path .pixi
            "book/**/*.md" "notebooks/*.ipynb" "*.md"
          fail: true
