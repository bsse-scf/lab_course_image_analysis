[workspace]
name = "labcourse-ia-2026"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
requires-pixi = ">=0.67"

# Default environment: everything a student needs for the Python track.
# Deliberately absent: pyimagej / openjdk / maven. Weka is trained *and* applied
# in Fiji on day 1; day 2 reads the exported probability maps back in with
# tifffile, so nothing in the Python track ever boots a JVM.
# Make `from course import DATA, show` work from anywhere in the project -
# notebooks/, .course/solutions/python/, or .course/scripts/ - rather than only
# from notebooks/.
[activation.env]
PYTHONPATH = "$PIXI_PROJECT_ROOT/notebooks"
JUPYTER_CONFIG_PATH = "$PIXI_PROJECT_ROOT/.jupyter"
# jupyter-app-launcher reads jp_app_launcher*.y[a]ml from this directory.
JUPYTER_APP_LAUNCHER_PATH = "$PIXI_PROJECT_ROOT/.jupyter"

# Pixi evaluates activation.env in the system shell: bash on Unix, cmd.exe on
# Windows. cmd.exe leaves `$PIXI_PROJECT_ROOT` unexpanded, so without this
# block Windows gets literal `$PIXI_PROJECT_ROOT/...` values - JupyterLab then
# finds neither the tutor config nor the 🎓 toolbar button, and `import course`
# fails. Keep the two blocks in sync.
[target.win-64.activation.env]
PYTHONPATH = "%PIXI_PROJECT_ROOT%\\notebooks"
JUPYTER_CONFIG_PATH = "%PIXI_PROJECT_ROOT%\\.jupyter"
JUPYTER_APP_LAUNCHER_PATH = "%PIXI_PROJECT_ROOT%\\.jupyter"

[dependencies]
python = "3.11.*"
pip = "*"

# --- notebook stack ---
jupyterlab = "*"
jupyter_server = "*"
notebook = ">=7.2.1,<8"
ipykernel = "*"
ipython = ">=8.26.0,<10"
ipympl = "*"

# --- scientific stack ---
numpy = "*"
scipy = ">=1.14.0,<2"
scikit-image = ">=0.25.0,<1"
scikit-learn = ">=1.5.1,<2"
pandas = ">=2.2.2,<3"
matplotlib = ">=3.9.2,<4"
seaborn = "*"

# --- image i/o ---
tifffile = ">=2024.7.24"
imagecodecs = "*"
pillow = ">=10.4.0"
nd2 = "*"
h5py = ">=3.11.0,<4"

# --- viewers ---
# stackview is the inline viewer used throughout the notebooks; napari is a
# required dependency for the interactive multi-channel sections.
stackview = "*"
pyqt = "*"

# --- misc ---
natsort = ">=8.4.0,<9"
tqdm = "*"
requests = ">=2.32.3,<3"
pooch = "*"

# --- segmentation ---
# Every student needs cellpose on day 2, so it lives in the default environment
# rather than behind an opt-in feature. It is the heaviest item here (it pulls
# torch), so it dominates the day-0 install time - measure it in the M7 rehearsal.
cellpose = "<4"

# --- app launcher ---
# Required by jupyter-app-launcher's `local-server` entry type (Course Book).
jupyter-server-proxy = "*"

# --- testing ---
pytest = "*"
nbmake = "*"

# --- pins ---
# litellm (pulled in by jupyter-ai[jupyternaut]) requires importlib-metadata<9,
# but the conda solve would otherwise pick 9.x and the pypi solve then fails.
importlib-metadata = "<9"
dask = ">=2024.6"

[pypi-dependencies]
# iaf is on public PyPI as of 1.5.3 - no extra-index-url needed any more.
pybis = ">=1.37.5"
iaf = ">=1.5.3"
jupyterlab-git = ">=0.54.1, <0.55"
jupyterlab-latex = ">=4.4.0, <5"
# `jupyternaut` is the LiteLLM chat backend the Course Tutor persona in
# `.jupyter/personas/` builds on. Its only release so far is a pre-release,
# which the resolver refuses unless a requirement names it explicitly.
jupyter-ai = { version = ">=3.2.0, <4", extras = ["jupyternaut"] }
jupyter-ai-jupyternaut = ">=0.1.0rc0"
jupyter-app-launcher = ">=0.3.2"
napari = { version = ">=0.6.5, <0.7", extras = ["all"] }
jupyterlab-rise = ">=0.43.1, <0.44"
jupyter-remote-desktop-proxy = ">=3.0.1, <4"

[tasks]
lab = "jupyter lab"
test = "pytest .course/tests"
# Execute the walkthrough notebooks. Named explicitly rather than globbed: the
# generated *_ex.ipynb are blank by construction and MUST fail if executed, and
# 03 is slow because it runs cellpose.
test-nb = """pytest --nbmake --nbmake-timeout=900 \
  notebooks/00_python_basics.ipynb \
  notebooks/01_image_handling.ipynb \
  notebooks/02_image_processing.ipynb \
  notebooks/04_segmentation_metrics.ipynb \
  notebooks/05_features.ipynb \
  notebooks/06_curve_fitting.ipynb"""
test-nb-heavy = "pytest --nbmake --nbmake-timeout=1800 notebooks/03_ml_segmentation.ipynb"
fetch-data = "python .course/scripts/fetch_data.py"
make-exercises = "python .course/scripts/make_exercises.py"
make-derived = "python .course/scripts/make_derived_data.py"
check-schedule = "python .course/scripts/check_schedule.py"
sync-solutions = "bash .course/scripts/sync_solutions.sh"

# --- docs: builds the book without the heavy scientific stack ---
[feature.docs.dependencies]
python = "3.11.*"
jupyter-book = "<2"
jupyter_server = "*"
jupyterlite-pyodide-kernel = "*"

[feature.docs.tasks]
book-clean = "jupyter-book clean . --all"
book = "jupyter-book build . --config book/_config.yml --toc book/_toc.yml --all"
# JupyterLite site with the python basics notebooks, served at <site>/lite/.
# Run after `book`; the two book/python_basics*.md pages iframe it.
lite = """jupyter lite build \
  --contents notebooks/00_python_basics.ipynb \
  --contents notebooks/00_python_basics_ex.ipynb \
  --output-dir _build/html/lite"""

[environments]
default = { solve-group = "main" }
docs = { features = ["docs"], no-default-feature = true }
