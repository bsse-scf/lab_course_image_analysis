# CI for the Image Analysis lab course.
#
# GitLab is the primary home; .github/workflows/ mirrors this for the GitHub
# copy of the repository.

variables:
  # `.course/solutions/` is a private submodule hosted on GitHub. Only the
  # unit-test job needs it, and it fetches it explicitly (see `.solutions`
  # below) because the runner has no GitHub credentials of its own.
  GIT_SUBMODULE_STRATEGY: none
  # pixi caches its package downloads here so the cache below can pick them up.
  PIXI_CACHE_DIR: "$CI_PROJECT_DIR/.pixi-cache"

default:
  image: ghcr.io/prefix-dev/pixi:0.77.1
  # The environment is ~3.5 GB, so caching it is the difference between a
  # two-minute pipeline and a fifteen-minute one. Keyed on the lock file:
  # a dependency change invalidates it, nothing else does.
  cache:
    key:
      files:
        - pixi.lock
    paths:
      - .pixi-cache/
      - .pixi/envs/

stages:
  - test
  - build
  - deploy

# --- Qt/OpenGL libraries, needed for `import napari` on a headless runner ---
.qt_deps: &qt_deps
  - apt-get update -qq
  - >-
    apt-get install -y --no-install-recommends
    libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 xvfb
    libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0
    libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-cursor0

# --- the private solutions submodule, required by the exercise-sync and ---
# --- schedule tests (they fail, not skip, without it) ---------------------
# SOLUTIONS_TOKEN is a masked CI/CD variable holding a GitHub fine-grained
# PAT with read access to the solutions repository.
.solutions: &solutions
  - test -n "$SOLUTIONS_TOKEN" || { echo "SOLUTIONS_TOKEN is not set" >&2; exit 1; }
  - git config --global url."https://x-access-token:${SOLUTIONS_TOKEN}@github.com/".insteadOf "https://github.com/"
  - git submodule update --init .course/solutions

unit tests:
  stage: test
  before_script:
    - *qt_deps
    - *solutions
  script:
    - pixi run test --junitxml=report.xml
    - pixi run check-schedule
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

notebooks execute:
  stage: test
  before_script: *qt_deps
  script:
    # xvfb supplies a virtual display so napari cells can run.
    - xvfb-run -a pixi run test-nb
  # Slower than the unit tests; do not block a merge request on it.
  allow_failure: false

data integrity:
  stage: test
  script:
    # Every file named in data/MANIFEST.md must be present and match its
    # checksum. Catches a truncated clone or a corrupted image.
    - pixi run fetch-data --verify

book:
  stage: build
  script:
    - pixi run -e docs book-clean
    - pixi run -e docs book
  artifacts:
    paths:
      - _build/html
    expire_in: 1 week

pages:
  stage: deploy
  script:
    - pixi run -e docs book-clean
    - pixi run -e docs book
    - pixi run -e docs lite
    - mv _build/html public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "2026"

links:
  stage: test
  image: lycheeverse/lychee:latest
  cache: []
  script:
    - >-
      lychee --no-progress --accept 200,206,403,429
      --exclude-path _build --exclude-path .pixi
      "book/**/*.md" "notebooks/*.ipynb" "*.md"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true
