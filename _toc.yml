          - file: book/fiji/e3_segmentation.md
          - file: book/fiji/e4_weka.md
          - file: book/fiji/e5_macros.md
          - file: book/fiji/fun/how_wide_is_a_filament.md
          - file: book/fiji/fun/spot_the_artifact.md
