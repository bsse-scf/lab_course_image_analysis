# Part captions mirror the structure in detailed_schedule.md.
#
# Only pages that EXIST are listed here. Pages still to be written -- the concept
# pages and the two starter notebooks -- are tracked in detailed_schedule.md
# and should be added below as they land. A TOC entry for a file that does not
# exist breaks the book build.
format: jb-book
root: book/landing.md

parts:
