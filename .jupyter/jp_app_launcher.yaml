# Custom JupyterLab launcher entries (jupyter-app-launcher).
#
# Discovered three ways; we rely on the first two:
#   * JUPYTER_APP_LAUNCHER_PATH points here (pixi [activation.env] locally,
#     .binder/start on RRP);
#   * jupyter-app-launcher also reads jp_app_launcher*.y[a]ml from the dir
#     where JupyterLab was started (the repo root in both cases).
#
# The subprocess receives a free port in $PORT; `source` is polled for 120 s
# and proxied through jupyter-server-proxy at <base_url>/proxy/<port>/.
- title: Course Book
  description: Build (if needed) and open the Course Book
  type: local-server
  cwd: /home/jovyan/project
  source: http://localhost:$PORT/
  args:
    - python
    - /home/jovyan/project/.course/scripts/serve_book.py
  catalog: Course